version: '3.8'

services:
  signaldesk:
    build: .
    container_name: signaldesk_terminal
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
