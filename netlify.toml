[build]
  publish = "static"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Route API calls to the Mangum serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Fallback for base /api path
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200

# Route root and all remaining web pages to index.html
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
