[build]
  publish = "static"
  functions = "netlify/functions"
  command = "pip install -r requirements.txt"

[build.environment]
  PYTHON_VERSION = "3.11"

# Route /static/* paths directly to published root files (style.css, app.js)
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

# Route API calls to the Mangum serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Fallback for base /api path
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200

# Route root and all remaining web pages to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

